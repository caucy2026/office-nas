name: Collabora Android smoke

on:
  push:
    tags:
      - "collabora-preflight-*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Gerrit commit SHA or ref. Defaults to the preflight-verified immutable source."
        required: true
        default: "af7c4b942004777653ddcaa1e79a84dc6c4de5b3"
        type: string
      mode:
        description: "preflight validates the real source and configure path; assemble performs the expensive arm64 build."
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - assemble

permissions:
  contents: read

concurrency:
  group: collabora-android-arm64-${{ github.repository }}
  # A newer preflight tag supersedes a stale preflight. Manual `assemble` runs
  # are never cancelled: native engine builds remain queued and reproducible.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ABI: arm64-v8a
      # Collabora Gerrit main rejects r23; use Android's r27 LTS line.
      NDK_VERSION: 27.3.13750724
      # A protected tag can start the low-cost preflight without a REST token.
      # Manual runs may select another immutable ref and the expensive mode.
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'af7c4b942004777653ddcaa1e79a84dc6c4de5b3' }}
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'preflight' }}
      COLLABORA_ROOT: ${{ github.workspace }}/.work/collabora-office
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Free ephemeral runner disk
        shell: bash
        run: |
          set -euxo pipefail
          # This is an isolated GitHub-hosted VM. Reclaim preinstalled toolchains
          # before the large LibreOffice engine build; the Android SDK is installed below.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/android-commandline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-commandline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          # sdkmanager exits after accepting all licenses, which gives `yes`
          # SIGPIPE (141). Preserve strict mode but judge sdkmanager itself.
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          sdkmanager_status="${PIPESTATUS[1]}"
          set -o pipefail
          test "$sdkmanager_status" -eq 0
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf automake bison build-essential ccache cmake curl flex gperf git \
            libtool libxml2-dev libxslt1-dev make nasm openjdk-17-jdk pkg-config \
            python3 python3-dev rsync unzip zip zlib1g-dev

      - name: Resolve immutable Collabora source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$(dirname "$COLLABORA_ROOT")"
          # A preflight needs one ref, not the monorepo's whole Git history.
          # `timeout` avoids a stalled Gerrit connection consuming the six-hour job.
          git init --initial-branch=bootstrap "$COLLABORA_ROOT"
          git -C "$COLLABORA_ROOT" remote add origin https://gerrit.collaboraoffice.com/online
          timeout 1200 git -C "$COLLABORA_ROOT" fetch --depth=1 origin "$SOURCE_REF"
          git -C "$COLLABORA_ROOT" checkout --detach FETCH_HEAD
          test -d "$COLLABORA_ROOT/engine"
          test -d "$COLLABORA_ROOT/android"
          source_sha="$(git -C "$COLLABORA_ROOT" rev-parse HEAD)"
          printf 'source_ref=%s\nsource_sha=%s\nabi=%s\nndk=%s\nmode=%s\n' \
            "$SOURCE_REF" "$source_sha" "$ABI" "$NDK_VERSION" "$BUILD_MODE" \
            | tee "$GITHUB_WORKSPACE/collabora-build-metadata.txt"
          printf '### Collabora source resolved\n\n`%s`\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"
          printf '::notice title=Collabora source SHA::%s\n' "$source_sha"

      - name: Configure or assemble Collabora Android
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          bash tools/ci/collabora-android.sh 2>&1 | tee "$GITHUB_WORKSPACE/out/collabora-smoke.log"

      - name: Publish native configure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          log="$COLLABORA_ROOT/engine/config.log"
          build_config_log="$COLLABORA_ROOT/engine/CONF-FOR-BUILD/config.log"
          autogen_log="$GITHUB_WORKSPACE/out/engine-autogen.log"
          smoke_log="$GITHUB_WORKSPACE/out/collabora-smoke.log"
          diagnostic=""
          if [[ -f "$build_config_log" ]]; then
            diagnostic="$(grep -Ei '(configure: error|(^|[[:space:]])error:|failed|missing|not found|unable)' "$build_config_log" | tail -n 1 || true)"
          fi
          if [[ -f "$smoke_log" ]]; then
            if [[ -z "$diagnostic" ]]; then
              diagnostic="$(grep -Ei '(configure: error|(^|[[:space:]])error:|failed|missing|not found|unable)' "$smoke_log" | tail -n 1 || true)"
            fi
          fi
          if [[ -z "$diagnostic" && -f "$autogen_log" ]]; then
            diagnostic="$(grep -Ei '(configure: error|(^|[[:space:]])error:|failed|missing|not found|unable)' "$autogen_log" | tail -n 1 || true)"
          fi
          if [[ -z "$diagnostic" && -f "$log" ]]; then
            diagnostic="$(grep -Ei '(configure: error|(^|[[:space:]])error:|failed|missing|not found|unable)' "$log" | tail -n 1 || true)"
            if [[ -z "$diagnostic" ]]; then
              diagnostic="$(tail -n 1 "$log" || true)"
            fi
          fi
          if [[ -z "$diagnostic" ]]; then
            diagnostic="engine/config.log was not created; failure happened before configure completed."
          fi
          diagnostic="$(printf '%s' "$diagnostic" | tr '\r\n' ' ' | sed 's/::/: :/g')"
          printf '::error title=Collabora engine configure::%s\n' "${diagnostic:0:900}"
          # Job-log archives are authentication-restricted even for some public
          # repositories. Emit a small, sanitized context window as annotations,
          # which remains available from the public Checks API.
          context_lines="$({
            for candidate in "$build_config_log" "$smoke_log" "$autogen_log" "$log"; do
              if [[ -f "$candidate" ]]; then
                grep -Ei '(configure: error|(^|[[:space:]])error:|failed|missing|not found|unable)' "$candidate" || true
              fi
            done
          } | tail -n 8)"
          if [[ -z "$context_lines" && -f "$smoke_log" ]]; then
            context_lines="$(tail -n 8 "$smoke_log")"
          fi
          while IFS= read -r context_line; do
            [[ -z "$context_line" ]] && continue
            context_line="$(printf '%s' "$context_line" | tr '\r\n' ' ' | sed 's/::/: :/g')"
            printf '::error title=Collabora configure context::%s\n' "${context_line:0:900}"
          done <<< "$context_lines"
          {
            echo "### Collabora native configure diagnostics"
            echo
            echo '```text'
            if [[ -f "$smoke_log" ]]; then
              echo "--- smoke script output ---"
              tail -n 80 "$smoke_log"
              echo
            fi
            if [[ -f "$build_config_log" ]]; then
              echo "--- BUILD-side config.log ---"
              grep -Ei '(error|failed|missing|not found|unable)' "$build_config_log" | tail -n 80 || true
              echo
              echo "--- final BUILD-side config.log lines ---"
              tail -n 80 "$build_config_log"
              echo
            fi
            if [[ -f "$log" ]]; then
              if [[ -f "$autogen_log" ]]; then
                echo "--- autogen output ---"
                grep -Ei '(configure: error|error:|failed|missing|not found|unable)' "$autogen_log" | tail -n 80 || true
                echo
              fi
              grep -Ei '(error|failed|missing|not found|unable)' "$log" | tail -n 80 || true
              echo
              echo "--- final config.log lines ---"
              tail -n 80 "$log"
            else
              echo "engine/config.log was not created; failure happened before configure completed."
              find "$COLLABORA_ROOT" -maxdepth 3 -name config.log -print 2>/dev/null || true
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collabora-${{ env.ABI }}-${{ inputs.mode }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            collabora-build-metadata.txt
            out/**
            out/collabora-smoke.log
            out/engine-autogen.log
            .work/collabora-office/config.log
            .work/collabora-office/engine/config.log
            .work/collabora-office/engine/CONF-FOR-BUILD/config.log
            .work/collabora-office/android/**/build/reports/**
